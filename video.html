<title>Saniket and Shrejal Wedding Film</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap">
<style>
/* Layout: a dark cinema stage with a 9:16 canvas (phone-video shape) and one control bar. The film itself is drawn on the canvas. */
:root {
  --stage: #140307;
  --panel: #2A0A12;
  --edge: #5B1A27;
  --ivory: #FFF1DA;
  --gold: #EDA81C;
  --muted: #D8B88A;
  --display: "Yatra One", Georgia, serif;
  --body: "Cormorant Garamond", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--stage); color: var(--ivory); font-family: var(--body); font-size: 1.15rem; line-height: 1.4;
  padding-block: 20px 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; justify-items: center; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; color: var(--gold); margin: 0; text-align: center; }
.sub { margin: 0; color: var(--muted); text-align: center; text-wrap: balance; }
.frame { width: min(100%, calc(78vh * 9 / 16)); border: 2px solid var(--gold); border-radius: 10px; padding: 6px; background: #000; box-shadow: 0 18px 50px rgba(0,0,0,.6); }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 9 / 16; border-radius: 5px; background: #220409; }
.bar { width: 100%; display: grid; gap: 10px; background: var(--panel); border: 1.5px solid var(--edge); border-radius: 12px; padding: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.t { flex-wrap: nowrap; }
button { font: inherit; font-weight: 700; letter-spacing: .05em; cursor: pointer; border-radius: 999px; padding: 8px 18px; border: 2px solid var(--gold); background: transparent; color: var(--ivory); }
button:hover:not(:disabled) { background: rgba(237,168,28,.18); }
button.primary { background: var(--gold); color: #3A0811; }
button.primary:hover:not(:disabled) { background: #F7BE45; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--gold); }
#time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 5.5em; text-align: right; }
.status { margin: 0; min-height: 1.4em; color: var(--muted); font-style: italic; text-wrap: balance; }
.result { width: 100%; display: grid; gap: 10px; justify-items: center; }
.result video { width: min(100%, calc(60vh * 9 / 16)); border-radius: 8px; border: 2px solid var(--gold); background: #000; }
.note { font-size: 1rem; color: var(--muted); text-align: center; margin: 0; text-wrap: balance; }
</style>

<main>
  <h1>Shrejal &amp; Saniket</h1>
  <p class="sub">A wedding invitation film. Press play to watch, or record it as an MP4 video to share, with peaceful flute music.</p>
  <div class="frame"><canvas id="cv" width="720" height="1280" aria-label="Animated wedding invitation film for Shrejal and Saniket" role="img"></canvas></div>

  <div class="bar">
    <div class="row t">
      <button id="play" class="primary" disabled>Play</button>
      <input id="seek" type="range" min="0" max="40" step="0.05" value="0" aria-label="Seek">
      <span id="time">0:00 / 0:40</span>
    </div>
    <div class="row">
      <button id="restart" disabled>Restart</button>
      <button id="sound" aria-pressed="true">Sound: on</button>
      <button id="song">Add song</button><input id="songfile" type="file" accept="audio/*" hidden>
      <button id="rec" disabled>Record video (MP4)</button>
    </div>
    <p class="status" id="status" role="status">Loading the film...</p>
  </div>

  <div class="result" id="result" hidden>
    <video id="vid" controls playsinline></video>
    <button id="save" class="primary">Save video (.mp4)</button>
  </div>
  <p class="note">Recording plays the whole film in real time, about 40 seconds, so keep this tab open and in view until it finishes.</p>
</main>
